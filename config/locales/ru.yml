  field_helpdesk_kb_rerank_timeout: 'Таймаут (с)'
  text_helpdesk_kb_rerank_scoring_info: 'Из векторного магазина берутся кандидаты, оцениваются заново, и из них сохраняются лучшие Top-K выше минимального значения. Пока реранкинг активен, это минимальное значение заменяет минимальное по схожести выше — это разные шкалы, настраивать их нужно раздельно. Если реранкер выходит из строя, незаметно снова применяется порядок по схожести с его минимальным значением.'
  text_helpdesk_kb_privacy_info: 'Защита данных: текст проблемы/решения передается провайдеру эмбеддингов и сохраняется в векторном магазине. При активном реранкере при каждом поиске текущий текст заявки вместе с текстами проблем кандидатов — то есть содержимое других заявок того же проекта — передается в одном запросе провайдеру реранкера; там ничего не сохраняется. Для полностью локальной работы используйте самостоятельно размещенные конечные точки для эмбеддингов и реранкера. Знания строго привязаны к проекту.'
