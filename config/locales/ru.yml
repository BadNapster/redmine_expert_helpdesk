  text_helpdesk_info_request_note_visibility_info: 'Заметка фиксирует, что уточняющий запрос был отправлен и что спрашивалось. Публичная держит сотрудника и клиента в курсе; внутренняя требует права «Просматривать частные заметки».'
  text_helpdesk_info_request_enabled_info: 'Главный переключатель. Пока он выключен, ни один проект не проверяет — независимо от его настроек.'
  text_helpdesk_info_request_mode_info: 'Проверяется ТОЛЬКО первое письмо новой заявки. Режим на основе правил работает без ИИ; режим с ИИ требует настроек ИИ выше.'
  text_helpdesk_info_request_globally_off: 'Проверка полноты централизованно отключена (Администрирование → Плагины), поэтому эти настройки пока не действуют.'
  text_helpdesk_info_request_ai_unavailable: 'ИИ централизованно отключен, поэтому режим «С помощью ИИ» работать не может. Используйте режим на основе правил или сначала включите ИИ.'
  text_helpdesk_info_request_min_chars_info: 'Более короткие письма считаются неполными. Перед замером удаляются цитируемые переписки и подписи. 0 отключает это правило.'
  text_helpdesk_info_request_min_words_info: 'Как выше, подсчет в словах. 0 отключает это правило.'
  text_helpdesk_info_request_require_attachment_info: 'Считать письма вообще без вложений (скриншот, лог, фото) неполными.'
  field_helpdesk_info_request_min_attachment_kb: 'Минимальный размер изображений'
  text_helpdesk_info_request_min_attachment_kb_info: 'В КБ. Меньшие изображения не считаются скриншотом или фото — логотипы подписей и пиксели отслеживания есть почти в каждом письме. Касается только изображений; небольшой лог или PDF по-прежнему считается. 0 отключает порог.'
  field_helpdesk_info_request_sender_blacklist: 'Этих отправителей никогда не спрашивать'
  field_helpdesk_contact_info_request_opt_out: 'Никогда не запрашивать дополнительную информацию'
  label_helpdesk_contact_info_request_opt_out_short: 'без уточняющего запроса'
  button_helpdesk_contact_info_request_stop: 'не спрашивать'
  button_helpdesk_contact_info_request_resume: 'спрашивать снова'
  text_helpdesk_contact_info_request_resume_info: 'Проверка полноты может снова запрашивать у этого клиента недостающие сведения.'
  text_helpdesk_contact_info_request_opt_out_info: 'За этим адресом никто не отвечает на уточняющий запрос: отчеты резервного копирования, мониторинговые оповещения, письма cron-задач. Заявки по-прежнему создаются и проверяются на полноту, но клиент никогда не опрашивается. Такое же решение для целого адреса или домена задается в настройке проекта «Этих отправителей никогда не спрашивать».'
  text_helpdesk_info_request_sender_blacklist_info: 'По одной записи в строке: полный адрес, чистый домен или "@domain". Отчеты резервного копирования, письма cron-задач и мониторинговые оповещения — настоящие заявки, но за ними никто не сможет ответить на уточняющий запрос. Письма, помечающие себя в заголовках как машинные, пропускаются и без записи: Auto-Submitted, Precedence (bulk, list, junk), X-Auto-Response-Suppress, X-MS-Exchange-Generated-Message-Source, а также заголовки X-Autoreply/X-Autorespond/X-Autoresponder. Отчеты о недоставке (NDR) не пропускаются.'
  text_helpdesk_info_request_keywords_info: 'По одному термину в строке. Письмо должно содержать хотя бы один из них, иначе оно считается неполным. Пусто отключает это правило.'
  text_helpdesk_info_request_threshold_info: 'Сколько правил должно быть нарушено, прежде чем последует запрос. 1 = уже первое нарушенное правило вызывает уточняющий запрос.'
  text_helpdesk_info_request_ai_prompt_info: 'Модель должна отвечать в формате JSON ({"complete": true|false, "missing": [...]}). Все нечитаемое считается полным — письмо при этом не отправляется.'
  text_helpdesk_info_request_subject_info: 'Макросы разрешены. Пусто = используется центральный стандартный текст.'
  text_helpdesk_info_request_body_info: 'Макросы разрешены. {{missing_info}} вставляет список недостающих сведений. Пусто = используется центральный стандартный текст.'
  text_helpdesk_info_request_status_info: 'Необязательно, например, «Ожидание клиента». Пусто оставляет статус без изменений. Закрывающие статусы не предлагаются: закрытие заявки для SLA считается и реакцией, И решением, и этого не должна вызывать автоматическая проверка.'
  text_helpdesk_info_request_reason_too_short: 'Краткое описание проблемы (что именно не работает?)'
