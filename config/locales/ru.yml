  field_helpdesk_smtp_reply_to_mailbox: 'Устанавливать Reply-To на адрес почтового ящика'
  text_helpdesk_smtp_reply_to_mailbox_info: 'По умолчанию выключено. Оставляйте выключенным, если адрес отправителя и так доставляет в этот почтовый ящик — например, список рассылки, единственным участником которого является этот ящик; в таком случае Reply-To лишь раскроет внутренний адрес. Включайте, если письма на адрес отправителя не достигают этого ящика, иначе ответы клиентов не вернутся в заявку.'
