  label_helpdesk_kb_extract_detail_central: 'Центральная настройка (%{level})'
  text_helpdesk_kb_extract_detail_info: 'Сколько конкретных деталей сохраняют записи базы знаний. Общая: обобщенные проблема и решение. Специфическая: сохраняет названия приложений, версии, коды и тексты ошибок. Максимально специфическая: дополнительно пути, имена серверов и общих ресурсов, значения конфигурации и точный порядок шагов. На каждом уровне модели предписывается опускать пароли и персональные данные. Применяется к вновь извлеченным записям; существующие можно извлечь заново на вкладке «База знаний».'
