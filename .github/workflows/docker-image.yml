name: Docker image smoke test

# Complements the source-based CI (ci.yml): tests the plugin against the *official*
# Redmine Docker images (https://hub.docker.com/_/redmine) - i.e. exactly the images
# we deploy with. Per tag, the official image is started with a fresh MariaDB, the
# plugin is mounted and migrated via REDMINE_PLUGINS_MIGRATE.
#
# The official entrypoint runs with `set -Eeo pipefail`: if a core or plugin
# migration or the init.rb load fails, the container exits and the page never
# comes up. A successful `/login` (HTTP 200) therefore proves that the plugin
# loads and migrates cleanly in the production image.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: redmine:${{ matrix.tag }} (official image)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Supported Redmine tags currently published on Docker Hub.
        tag: [ '5.1', '6.0', '6.1', '7.0' ]

    env:
      DB_NAME: redmine
      DB_PASS: root

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: redmine_expert_helpdesk

      - name: Create docker network
        run: docker network create rmnet

      - name: Start MariaDB
        run: |
          docker run -d --name db --network rmnet \
            -e MARIADB_ROOT_PASSWORD="$DB_PASS" \
            -e MARIADB_DATABASE="$DB_NAME" \
            --health-cmd="healthcheck.sh --connect --innodb_initialized" \
            --health-interval=5s --health-timeout=5s --health-retries=20 \
            mariadb:11.4 --transaction-isolation=READ-COMMITTED

      - name: Wait for MariaDB to be healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' db 2>/dev/null || echo starting)
            echo "attempt $i: db health=$status"
            [ "$status" = "healthy" ] && exit 0
            sleep 3
          done
          echo "MariaDB did not become healthy in time"; docker logs db; exit 1

      - name: Start official Redmine ${{ matrix.tag }} with the plugin
        run: |
          docker run -d --name redmine --network rmnet -p 3000:3000 \
            -e REDMINE_DB_MYSQL=db \
            -e REDMINE_DB_DATABASE="$DB_NAME" \
            -e REDMINE_DB_USERNAME=root \
            -e REDMINE_DB_PASSWORD="$DB_PASS" \
            -e REDMINE_PLUGINS_MIGRATE=1 \
            -v "$GITHUB_WORKSPACE/redmine_expert_helpdesk:/usr/src/redmine/plugins/redmine_expert_helpdesk:ro" \
            redmine:${{ matrix.tag }}

      - name: Wait for Redmine to boot (migrations + init.rb load)
        run: |
          code=000
          for i in $(seq 1 60); do
            # Fail immediately if the container exits (failed migration / init.rb).
            if [ "$(docker inspect -f '{{.State.Running}}' redmine 2>/dev/null)" != "true" ]; then
              echo "Redmine container exited early — dumping logs:"; docker logs redmine; exit 1
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login || true)
            echo "attempt $i: GET /login -> HTTP $code"
            [ "$code" = "200" ] && break
            sleep 5
          done
          [ "$code" = "200" ] || { echo "Timed out waiting for Redmine to serve /login"; docker logs redmine; exit 1; }

      - name: Assert the plugin was actually loaded and migrated
        run: |
          # Plugin migrations print the plugin's migration classes
          # (== N CreateHelpdeskMailboxes: migrating ...). Check case-insensitively
          # for "helpdesk" - version-independent (Redmine 5.x prints the plugin
          # *name* "Redmine expert Helpdesk" in the header, 6.x/7.x the *id*
          # "redmine_expert_helpdesk"; the migration names always contain "Helpdesk").
          # Without any helpdesk output, the plugin was not mounted/recognized.
          if ! docker logs redmine 2>&1 | grep -iq 'helpdesk'; then
            echo "No helpdesk output in Redmine logs — plugin not mounted/migrated:"
            docker logs redmine
            exit 1
          fi
          echo "Plugin loaded and migrated in official redmine:${{ matrix.tag }} image."
          docker logs redmine 2>&1 | grep -i 'helpdesk' | head -n 20 || true

      - name: Dump container logs on failure
        if: failure()
        run: |
          echo "===== redmine logs ====="; docker logs redmine 2>&1 || true
          echo "===== db logs ====="; docker logs db 2>&1 || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f redmine db 2>/dev/null || true
          docker network rm rmnet 2>/dev/null || true
