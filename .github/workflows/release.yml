name: Release

# On every pushed vX.Y.Z tag, builds a plugin archive (.zip + .tar.gz) and
# publishes a GitHub release with notes from the CHANGELOG.md.
# Runs ONLY on tags (not on branches/PRs) - releases only happen when the
# maintainer deliberately pushes a tag. Publish flow:
#   1. Set version '...' in init.rb, commit, push to main
#   2. git tag -a vX.Y.Z -m 'Release X.Y.Z' (on the same commit) && git push origin vX.Y.Z
#      Annotated (-a), not lightweight: git describe - and thus git submodule status
#      in the parent deployment repo - only sees annotated tags.
# The version number lives in init.rb (single source of truth); the workflow only
# CHECKS that init.rb version and tag match, and packages unchanged.

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write            # to create the release and upload the archives

# Do not cancel runs of the same tag (a release must finish).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the full history + tags (for the release-notes diff
      #    against the previous tag).
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Derive the version from the tag and validate it as semver.
      - name: Derive and validate version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          # SemVer 2.0.0 without build metadata. Spelled out rather than
          # approximated, because every shortcut here has already let something
          # through: '[-.]' on the suffix accepted v1.2.3.4, '[0-9A-Za-z.]+'
          # accepted 1.2.3-a..b, and a bare '[0-9]+' accepts leading zeroes,
          # which SemVer forbids in numeric identifiers (v01.2.3, v1.2.3-01).
          SEMVER='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          SEMVER="$SEMVER"'(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          SEMVER="$SEMVER"'(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          if ! echo "$VER" | grep -Eq "$SEMVER"; then
            echo "::error::Tag '$TAG' is not a valid semver version (expected vX.Y.Z)"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          case "$VER" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # 3. Make sure the version maintained in init.rb matches the tag.
      #    init.rb is the single source of truth - the tag must point to it.
      - name: Check init.rb version against tag
        run: |
          INIT_VER=$(sed -nE "s/^[[:space:]]*version '([^']*)'.*/\1/p" init.rb | head -1)
          echo "init.rb: '${INIT_VER}'  /  Tag: '${{ steps.ver.outputs.version }}'"
          if [ "$INIT_VER" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::init.rb version '${INIT_VER}' does not match the tag '${{ steps.ver.outputs.version }}'. Set version in init.rb, commit, and point the tag at that commit."
            exit 1
          fi

      # 4. Generate release notes from the CHANGELOG.md: the "## [<version>]"
      #    section that belongs to the tagged release.
      #
      #    Previously the diff against the previous tag was used instead.
      #    That only worked as long as the CHANGELOG sections were never
      #    reordered: git diff works line by line, a moved block reads as
      #    "deleted and re-added". When the headings were split into real
      #    versions on 2026-08-04, the entries of 0.2.1 and 0.2.0 would have
      #    landed in the notes of 0.2.2. The section of the tagged version is
      #    the direct answer to the question and does not need the comparison.
      - name: Generate release notes from CHANGELOG
        run: |
          VER="${{ steps.ver.outputs.version }}"
          awk -v ver="$VER" '
            $0 == "## [" ver "]" || index($0, "## [" ver "] ") == 1 { f = 1; next }
            f && /^## / { exit }
            f { print }
          ' CHANGELOG.md > SECTION.md
          if ! grep -q '[^[:space:]]' SECTION.md; then
            echo "::error::CHANGELOG.md has no section '## [${VER}]'. Add the entry for this version, commit, and point the tag at it."
            exit 1
          fi
          {
            echo "## redmine_expert_helpdesk ${VER} – $(date +%Y-%m-%d)"
            cat SECTION.md
          } > RELEASE_NOTES.md
          rm -f SECTION.md
          echo "----- RELEASE_NOTES.md -----"
          cat RELEASE_NOTES.md

      # 5. Package the plugin: runtime files under a top-level folder
      #    redmine_expert_helpdesk/ (unpacks directly into redmine/plugins/).
      #    Dev/CI/doc-internal-only files are excluded.
      - name: Package plugin (.zip + .tar.gz)
        run: |
          VER="${{ steps.ver.outputs.version }}"
          STAGE="$RUNNER_TEMP/pkg/redmine_expert_helpdesk"
          mkdir -p "$STAGE"
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='.claude' \
            --exclude='.gitignore' --exclude='.gitattributes' \
            --exclude='test' --exclude='scripts' --exclude='docs' \
            --exclude='CLAUDE.md' --exclude='plan.md' --exclude='ROADMAP.md' \
            --exclude='.dev.env*' --exclude='.tokensave' --exclude='RELEASE_NOTES.md' \
            ./ "$STAGE/"
          (
            cd "$RUNNER_TEMP/pkg"
            zip -rq "$GITHUB_WORKSPACE/redmine_expert_helpdesk-${VER}.zip"    redmine_expert_helpdesk
            tar czf "$GITHUB_WORKSPACE/redmine_expert_helpdesk-${VER}.tar.gz" redmine_expert_helpdesk
          )
          echo "----- Package contents (.zip) -----"
          unzip -l "redmine_expert_helpdesk-${VER}.zip" | head -n 40

      # 6. Create the GitHub release for the tag and attach both archives.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2   # uses GITHUB_TOKEN automatically
        with:
          name: redmine_expert_helpdesk ${{ steps.ver.outputs.version }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ steps.ver.outputs.prerelease }}
          files: |
            redmine_expert_helpdesk-${{ steps.ver.outputs.version }}.zip
            redmine_expert_helpdesk-${{ steps.ver.outputs.version }}.tar.gz

      # Tell the plugin website (expertZentrale/redmine-plugins) to rebuild, so
      # the new version and download links are live within minutes instead of
      # on its weekly cron. GITHUB_TOKEN cannot dispatch to another repository,
      # hence SITE_DISPATCH_TOKEN: a fine-grained token with Contents read/write
      # on redmine-plugins only. Missing token or a failed call never fails the
      # release - the site then catches up on its own schedule.
      - name: Notify the plugin website
        if: steps.ver.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::SITE_DISPATCH_TOKEN is not set - the website refreshes on its weekly cron"
            exit 0
          fi
          gh api repos/expertZentrale/redmine-plugins/dispatches -f event_type=plugin-released \
            && echo "Website rebuild requested" \
            || echo "::warning::Could not trigger the website rebuild - it refreshes on its weekly cron"
